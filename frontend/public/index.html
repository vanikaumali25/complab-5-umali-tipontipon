<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Shop - Event-Driven Microservices</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  input, button { padding: 10px; margin: 6px 0; width: 100%; box-sizing: border-box; }
  button { background: #2c7be5; color: white; border: none; cursor: pointer; font-size: 16px; }
  button:hover { background: #1a5bb8; }
  #result { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; }
  .ok { background: #d4edda; color: #155724; }
  .err { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>
  <h1>Mini Shop</h1>
  <p>Place an order using the form below.</p>
  <form id="orderForm">
    <input id="productId" placeholder="Product ID" required>
    <input id="quantity" type="number" min="1" placeholder="Quantity" required>
    <input id="customerName" placeholder="Customer Name">
    <button type="submit">Place Order</button>
  </form>
  <div id="result"></div>
<script>
document.getElementById('orderForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    productId: document.getElementById('productId').value,
    quantity: document.getElementById('quantity').value,
    customerName: document.getElementById('customerName').value
  };
  const res = await fetch('/api/orders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  const box = document.getElementById('result');
  box.style.display = 'block';
  box.className = res.ok ? 'ok' : 'err';
  box.textContent = res.ok
    ? `Order placed! ID: ${data.orderId}, Product: ${data.productId}, Qty: ${data.quantity}`
    : `Error: ${data.error || 'Unknown error'}`;
});
</script>
</body>
</html>
